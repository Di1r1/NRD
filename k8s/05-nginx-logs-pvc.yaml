# Аналог именованного volume nginx_logs из docker-compose.yml — он был
# одновременно смонтирован read-write в web (nginx туда пишет access-логи по
# дням) и read-only в backend (backend их зипует и отдаёт по кнопке
# "Access-логи nginx"). В Docker это работало "бесплатно" — один хост, один
# volume driver. В Kubernetes для этого нужен ReadWriteMany (RWX) PVC — том,
# который можно одновременно примонтировать в разные поды на разных узлах.
#
# ВАЖНО: StorageClass "по умолчанию" в большинстве кластеров (облачные диски
# вроде EBS/PD/Azure Disk) поддерживает только ReadWriteOnce и этот PVC не
# создастся ("waiting for first consumer" / FailedAttachVolume). Нужен RWX-
# storage class — например NFS (nfs-subdir-external-provisioner), CephFS,
# Azure Files, EFS (aws-efs-csi-driver) и т.п. Уточните у вашей
# инфраструктурной команды, какой RWX StorageClass доступен в кластере, и
# впишите его имя ниже в storageClassName.
#
# Если подходящего RWX-класса нет и заводить его ради логов access.log не
# хочется — альтернатива: не шарить том между подами, а слать access-логи
# nginx в stdout (как это и так уже делает дефолтный access_log в базовом
# образе, см. комментарий в nginx.conf) и собирать их через штатный для
# кластера механизм логирования (Fluentd/Vector + Loki/ELK), отказавшись от
# кнопки "Access-логи nginx" на /admin/settings либо переделав её на другой
# источник. Это отдельное архитектурное решение, не решаю его здесь за вас.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: nginx-logs
  namespace: nrd-business-panel
spec:
  accessModes: ["ReadWriteMany"]
  # storageClassName: <впишите имя RWX storage class вашего кластера>
  resources:
    requests:
      storage: 5Gi
