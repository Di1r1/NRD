# Дословная копия nginx/nginx.conf и nginx/common-locations.conf из основного
# репозитория. Меняете их в репозитории — продублируйте изменения сюда (или
# генерируйте этот файл автоматически в CI из исходников вместо ручной копии,
# см. README.md).
apiVersion: v1
kind: ConfigMap
metadata:
  name: adminpanel-nginx-config
  namespace: {{ include "adminpanel.namespace" . }}
data:
  nginx.conf: |
    server_tokens off;

    limit_req_zone $binary_remote_addr zone=login_limit:10m rate=60r/m;

    map $time_iso8601 $logdate {
        default 'unknown';
        "~^(?<date>\d{4}-\d{2}-\d{2})" $date;
    }
    open_log_file_cache max=10 valid=1m inactive=10m;
    access_log /var/log/nginx/access-$logdate.log combined;

    server {
        listen 80;
        server_name _;
        include /etc/nginx/common-locations.conf;
    }

    server {
        listen 443 ssl;
        server_name _;

        ssl_certificate     /etc/nginx/certs/server.crt;
        ssl_certificate_key /etc/nginx/certs/server.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1d;

        add_header Strict-Transport-Security "max-age=86400" always;

        include /etc/nginx/common-locations.conf;
    }
  common-locations.conf: |
    root /usr/share/nginx/html;
    index index.html;

    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), camera=(), microphone=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /api/auth/login {
        limit_req zone=login_limit burst=20 nodelay;
        proxy_pass http://backend:8080/api/auth/login;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        proxy_pass http://backend:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 25m;
    }

    location /actuator/health {
        proxy_pass http://backend:8080/actuator/health;
    }
