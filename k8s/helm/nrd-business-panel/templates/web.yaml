apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: {{ include "adminpanel.namespace" . }}
  labels: {{ include "adminpanel.labels" . | nindent 4 }}
spec:
  selector:
    app: web
  ports:
    - name: http
      port: 80
      targetPort: 80
    - name: https
      port: 443
      targetPort: 443
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: {{ include "adminpanel.namespace" . }}
  labels: {{ include "adminpanel.labels" . | nindent 4 }}
spec:
  {{- if not .Values.web.autoscaling.enabled }}
  replicas: {{ .Values.web.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      containers:
        - name: web
          image: "{{ .Values.image.registry }}/{{ .Values.image.frontend.repository }}:{{ .Values.image.frontend.tag }}"
          imagePullPolicy: {{ .Values.image.frontend.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          ports:
            - containerPort: 80
            - containerPort: 443
          volumeMounts:
            - name: nginx-conf
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: nginx.conf
            - name: nginx-conf
              mountPath: /etc/nginx/common-locations.conf
              subPath: common-locations.conf
            - name: nginx-certs
              mountPath: /etc/nginx/certs
            - name: nginx-logs
              mountPath: /var/log/nginx
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 15
          resources: {{ toYaml .Values.web.resources | nindent 12 }}
      volumes:
        - name: nginx-conf
          configMap:
            name: adminpanel-nginx-config
        - name: nginx-certs
          emptyDir: {} # самоподписанный сертификат нужен только если решите терминировать TLS на самом поде, см. README.md; при TLS на Ingress — не используется извне
        - name: nginx-logs
          persistentVolumeClaim:
            claimName: nginx-logs
---
{{- if .Values.web.autoscaling.enabled }}
# ВАЖНО: работает только при настроенном RWX storageClassName у nginxLogs
# (values.yaml) — иначе дополнительные поды на других узлах не смогут
# примонтировать общий том логов. См. README.md, раздел "HPA для web".
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: web
  namespace: {{ include "adminpanel.namespace" . }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: web
  minReplicas: {{ .Values.web.autoscaling.minReplicas }}
  maxReplicas: {{ .Values.web.autoscaling.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.web.autoscaling.targetCPUUtilizationPercentage }}
{{- end }}
---
{{- if .Values.web.podDisruptionBudget.enabled }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: web
  namespace: {{ include "adminpanel.namespace" . }}
spec:
  maxUnavailable: {{ .Values.web.podDisruptionBudget.maxUnavailable }}
  selector:
    matchLabels:
      app: web
{{- end }}
---
{{- if .Values.networkPolicy.enabled }}
# web принимает трафик из namespace ingress-контроллера (по ingress.className
# должен быть тот же, что реально стоит в кластере) и внутри namespace — для
# kubelet-проб/отладки. Исходящий трафик к backend уже разрешён его же
# NetworkPolicy (ingress-правило у backend), egress у web не ограничиваем.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: web
  namespace: {{ include "adminpanel.namespace" . }}
spec:
  podSelector:
    matchLabels:
      app: web
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              {{- $parts := splitList "=" .Values.networkPolicy.ingressNamespaceLabel }}
              {{ index $parts 0 }}: {{ index $parts 1 }}
      ports:
        - port: 80
        - port: 443
{{- end }}
