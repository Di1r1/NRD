# ReadWriteMany — том одновременно смонтирован в backend (read-only) и в web
# (read-write), как и volume nginx_logs в docker-compose.yml. Требует RWX
# storage class (см. values.yaml: nginxLogs.storageClassName и README.md).
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: nginx-logs
  namespace: {{ include "adminpanel.namespace" . }}
  labels: {{ include "adminpanel.labels" . | nindent 4 }}
spec:
  accessModes: ["ReadWriteMany"]
  {{- if .Values.nginxLogs.storageClassName }}
  storageClassName: {{ .Values.nginxLogs.storageClassName }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.nginxLogs.storage }}
