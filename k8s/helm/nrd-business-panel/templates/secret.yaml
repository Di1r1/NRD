{{/*
По умолчанию (secrets.create=false) этот файл не рендерит ничего — секрет
adminpanel-secrets создаётся вручную вне чарта (см. README.md), чтобы реальные
значения не оседали ни в values.yaml, ни в `helm history`/release-объекте
дольше необходимого. Включайте secrets.create=true осознанно (например, из
CI, где значения приходят из защищённых переменных) — helm хранит значения
values релиза в Secret самого Helm, так что это не "бесплатно" безопаснее,
просто удобнее для автоматизации.
*/}}
{{- if .Values.secrets.create }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.secrets.existingSecretName }}
  namespace: {{ include "adminpanel.namespace" . }}
type: Opaque
stringData:
  POSTGRES_PASSWORD: {{ required "secrets.postgresPassword обязателен при secrets.create=true" .Values.secrets.postgresPassword | quote }}
  APP_JWT_SECRET: {{ required "secrets.jwtSecret обязателен при secrets.create=true" .Values.secrets.jwtSecret | quote }}
{{- end }}
