# Аналог сервиса web из docker-compose.yml (nginx: раздача собранного
# frontend + reverse-proxy на backend).
#
# TLS-сертификат: в оригинале nginx/generate-cert.sh генерирует самоподписанный
# сертификат в volume nginx_certs при первом старте контейнера и он переживает
# пересоздания. Здесь вместо PersistentVolumeClaim используется emptyDir —
# сертификат будет генерироваться заново при каждом пересоздании пода (это
# дёшево, секунда работы openssl) и НЕ будет использоваться снаружи, если вы
# терминируете TLS на Ingress (см. 06-ingress.yaml, рекомендуемый вариант) —
# тогда порт 443 внутри пода вообще не участвует во внешнем трафике, а :80
# пода закрыт от интернета самим Ingress/Service (ClusterIP).
# Если вместо этого вы хотите end-to-end TLS до самого пода (Ingress тоже по
# HTTPS до backend-сервиса) — смотрите комментарий в 06-ingress.yaml про
# backend-protocol: HTTPS, тогда самоподписанный сертификат из этого пода
# действительно будет использоваться, и emptyDir здесь достаточно (сертификат
# ведь не обязан быть одним и тем же между перезапусками для этого сценария).
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: nrd-business-panel
spec:
  selector:
    app: web
  ports:
    - name: http
      port: 80
      targetPort: 80
    - name: https
      port: 443
      targetPort: 443
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: nrd-business-panel
spec:
  replicas: 1 # см. 05-nginx-logs-pvc.yaml — с RWX-томом технически можно >1, но метрики/логи по-прежнему считаются независимо в каждом поде
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      containers:
        - name: web
          # ЗАМЕНИТЕ на реальный путь до образа в вашем registry (собирается из
          # frontend/Dockerfile — предварительно собранный frontend/dist-prebuilt,
          # см. build_and_export.bat / README.md в корне репозитория).
          image: repo.dev002.local/nrd-business-panel/frontend:latest
          ports:
            - containerPort: 80
            - containerPort: 443
          volumeMounts:
            - name: nginx-conf
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: nginx.conf
            - name: nginx-conf
              mountPath: /etc/nginx/common-locations.conf
              subPath: common-locations.conf
            - name: nginx-certs
              mountPath: /etc/nginx/certs
            - name: nginx-logs
              mountPath: /var/log/nginx
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 15
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              memory: 256Mi
      volumes:
        - name: nginx-conf
          configMap:
            name: adminpanel-nginx-config
        - name: nginx-certs
          emptyDir: {}
        - name: nginx-logs
          persistentVolumeClaim:
            claimName: nginx-logs
