# ШАБЛОН, НЕ ПРИМЕНЯТЬ КАК ЕСТЬ. По аналогии с .env.example в корне проекта —
# реальные секреты в git/репозиторий манифестов не кладём (см. комментарий в
# .env.example про утечку APP_JWT_SECRET в историю git при похожей ошибке раньше).
#
# Проще и безопаснее всего создать секрет напрямую командой, без промежуточного
# yaml-файла с настоящими значениями:
#
#   kubectl create secret generic adminpanel-secrets \
#     -n nrd-business-panel \
#     --from-literal=POSTGRES_PASSWORD='<случайный-пароль>' \
#     --from-literal=APP_JWT_SECRET="$(openssl rand -hex 32)"
#
# Если всё же нужен декларативный yaml (например, через внешний секрет-менеджер
# или Sealed Secrets/SOPS) — используйте этот файл как образец полей, но
# подставьте реальные значения в БАЗА64 (echo -n 'значение' | base64) и
# переименуйте в 01-secret.yaml, добавив его в .gitignore того репозитория,
# где будут лежать манифесты.
apiVersion: v1
kind: Secret
metadata:
  name: adminpanel-secrets
  namespace: nrd-business-panel
type: Opaque
data:
  # base64("adminpanel") — только для примера/локального теста, для прод-контура
  # обязательно сгенерируйте свои значения (см. команду выше).
  POSTGRES_PASSWORD: YWRtaW5wYW5lbA==
  # base64("замените-на-случайную-строку")
  APP_JWT_SECRET: 0LfQsNC80LXQvdC40YLQtS3QvdCwLdGB0LvRg9GH0LDQudC90YPRji3RgdGC0YDQvtC60YM=
